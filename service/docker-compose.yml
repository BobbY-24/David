services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: david
      POSTGRES_PASSWORD: david
      POSTGRES_DB: david
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U david -d david"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://david:david@postgres:5432/david
      REDIS_URL: redis://redis:6379/0
      REDIS_DISPATCH: "1"
      QUEUE_CAP: "32"
      MAX_ATTEMPTS: "3"
      LEASE_SECONDS: "30"
      # The key vault keeps its master key here. Set DAVID_MASTER_KEY instead to
      # supply your own. DAVID_API_TOKEN, when set, is required on vault and
      # model routes.
      DAVID_DATA_DIR: /data
      DAVID_API_TOKEN: ${DAVID_API_TOKEN:-}
      DAVID_MAX_MODEL_CALLS_PER_DAY: ${DAVID_MAX_MODEL_CALLS_PER_DAY:-100}
    ports:
      - "127.0.0.1:43124:43124"
    volumes:
      - david-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "david_lab.api:app", "--host", "0.0.0.0", "--port", "43124"]

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://david:david@postgres:5432/david
      REDIS_URL: redis://redis:6379/0
      REDIS_DISPATCH: "1"
      QUEUE_CAP: "32"
      MAX_ATTEMPTS: "3"
      LEASE_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "david_lab.worker:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
      ]

volumes:
  pgdata:
  david-data:
