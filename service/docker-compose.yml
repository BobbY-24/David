services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: david
      POSTGRES_PASSWORD: david
      POSTGRES_DB: david
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U david -d david"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://david:david@postgres:5432/david
      REDIS_URL: redis://redis:6379/0
      REDIS_DISPATCH: "1"
      QUEUE_CAP: "32"
      MAX_ATTEMPTS: "3"
      LEASE_SECONDS: "30"
    ports:
      - "43124:43124"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "david_lab.api:app", "--host", "0.0.0.0", "--port", "43124"]

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://david:david@postgres:5432/david
      REDIS_URL: redis://redis:6379/0
      REDIS_DISPATCH: "1"
      QUEUE_CAP: "32"
      MAX_ATTEMPTS: "3"
      LEASE_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "david_lab.worker:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
      ]
